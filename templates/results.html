<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分析结果-页面</title>
<style>
/* 全局样式重置 */
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

a {
    text-decoration: none;
    color: white;
}

/*页面基础样式*/
body{
    font-family: -apple-system,BlinkMacSystemfont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background: #f8f9fa;
    padding: 16px;
    line-height: 1.5;
}

/* 主容器 */
.analysis-card{
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    padding: 24px 20px;
    max-width: 600px;
    margin: 0 auto;
}

/* 标题样式 */
.main-title{
    font-size: 1.5rem;
    color: #1a1a1a;
    margin-bottom: 12px;
    font-weight: 600;
    line-height: 1.3;
}

/* 描述文本 */
.description{
    font-size: 0.875rem;
    color: #666;
    margin-bottom: 24px;
}

/* 分析结果区域 */
.result-container{
    margin-bottom: 24px;
}

.result-container h3{
    font-size: 0.9375rem;
    color: #333;
    margin-bottom: 8px;
    font-weight: 600;
}

/* 只读内容区域 */
.result-content{
    height: 100%;
    width: 100%;
    padding: 14px;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    min-height: 430px;
    font-size: 0.9375rem;
    line-height: 1.5;
    background: #f8f9fa;
    white-space: pre-wrap;
    word-wrap: break-word;
}

/* 操作按钮 */
.copy-btn{
    background: #007bff;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.875rem;
    width: 48%;
    margin: 10px 1%;
}

.copy-btn:hover{
    background: #0056b3;
}

/* 操作按钮容器 */
.bbtn{
    margin-bottom: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}


/* 响应式适配 */
@media(max-width:414px){
    .analysis-card{
        padding: 16px;
    }

    .result-content{
        min-height: 100px;
    }
}
</style>
</head>
<body>
    <div class="analysis-card">
        <h1 class="main-title">简历及岗位职责分析</h1>
        <p class="description">使用了deepseek R1模型,可以深度分析你的简历:请先上传简历和岗位职责,越详细起好,我将会帮你分析简历,同时给出优化建议</p>

        <div class="result-container">
            <h3>分析结果</h3>
            <div class="result-content" id="analysisResult">
                <!-- 分析结果将显示在此处 -->
                <p>{{ results }}</p>
            </div>
            <div class="bbtn">
            <button class="copy-btn" onclick="copyResult()">复制结果</button>
            <a href="/AIInterviewer"><button class="copy-btn">去面试</button></a>
                </div>
        </div>
    </div>

    <script>
        function copyResult() {
            const result = document.getElementById('analysisResult');
            const range = document.createRange();
            range.selectNode(result);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            document.execCommand('copy');
            window.getSelection().removeAllRanges();
            alert('已复制到剪贴板');
        }
    </script>
</body>
</html>
