<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            font-family: "Microsoft YaHei", sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .header {
            text-align: center;
            color: #2a5caa;
            margin-bottom: 30px;
        }

        .info-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .tag {
            display: inline-block;
            background: #e8f0fe;
            color: #2a5caa;
            padding: 6px 12px;
            border-radius: 20px;
            margin: 5px;
        }

        .data-section {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 25px;
        }

        .result-item {
            border-left: 4px solid #2a5caa;
            padding: 15px;
            background: white;
            margin: 10px 0;
        }

        .nav-button {
            background: #2a5caa;
            color: white !important;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            margin: 10px 5px;
        }
    </style>
    <link rel="stylesheet" href="../static/css/index.css" >
</head>
<body>
    <div class="header">
        <h1>超级面试官</h1>
        <h3>职位信息展示中心</h3>
    </div>

    <h3>精选岗位推荐</h3>
        {% for item in jobLsts %}
    <div class="info-card">

        <div class="result-item">

            <h4>{{ item.jobName }}</h4>
            <p>📍 {{ item.address }} · 💰 {{ item.salary }} </p>
            <p>{{ item.companyName }} · <a href="{{ item.url}}" target="_blank">查看详情</a></p>

        </div>

    </div>
    {% endfor %}

    <nav class="bottom-nav">
        <div class="nav-item">
            <a href="/ResumeAnalysis"><span>简历分析</span></a>
        </div>
        <div class="nav-item">
            <a href="/"><span>AI超级面试官</span></a>
        </div>
        <div class="nav-item active" >
            <a href="/search_job"><span>查找工作</span></a>
        </div>
    </nav>
</body>
</html>
